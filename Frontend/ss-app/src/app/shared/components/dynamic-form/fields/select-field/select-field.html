<mat-form-field appearance="outline">
    <mat-label>{{ config().etiqueta }}</mat-label>
    @if (config().icono) {
        <mat-icon matPrefix>{{ config().icono }}</mat-icon>
    }
    <mat-select [formControl]="control()" panelClass="dialog-select-panel">
        @for (op of config().opciones; track op) {
        <mat-option [value]="op">{{ op }}</mat-option>
        }
    </mat-select>
    @if (control().hasError('required')) { <mat-error>Required field</mat-error> }
</mat-form-field>
