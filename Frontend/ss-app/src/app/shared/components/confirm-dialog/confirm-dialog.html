<div
  class="confirm-dialog"
  [class.danger]="data.type === 'danger'"
  [class.warning]="data.type === 'warning'"
  [class.info]="data.type === 'info'"
>
  @switch (data.type) {
    @case ('danger') {
      <mat-icon>error</mat-icon>
    }
    @case ('warning') {
      <mat-icon>warning</mat-icon>
    }
    @default {
      <mat-icon>info</mat-icon>
    }
  }

  <h2 class="mat-dialog-title">{{ data.title }}</h2>

  <p class="dialog-message">{{ data.message }}</p>

  <div class="dialog-actions">
    @if (!data.notice) {
    <button type="button" mat-button class="cancel-btn" (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    }
    <button
      type="button"
      mat-raised-button
      class="confirm-btn"
      [class.danger]="data.type === 'danger'"
      (click)="onConfirm()"
    >
      {{ data.confirmText }}
    </button>
  </div>
</div>
