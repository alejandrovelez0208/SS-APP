<div class="photos-step">
  <div class="avatar-upload">
    <span class="avatar-upload__label">
      Profile Pictures ({{ photos.length }}/{{ maxPhotos }})
    </span>

    <div class="avatar-upload__body">
      <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)" />

      <button
        mat-stroked-button
        type="button"
        class="avatar-upload__btn"
        (click)="fileInput.click()"
        [disabled]="!canAddMorePhotos"
      >
        <mat-icon matPrefix>photo_camera</mat-icon>
        {{ canAddMorePhotos ? 'Add photo' : 'Maximum reached' }}
      </button>
    </div>

    @if (photosRemainingToMin > 0) {
      <span>
        Upload at least {{ photosRemainingToMin }} more photo
        {{ photosRemainingToMin > 1 ? 's' : '' }} to continue
      </span>
    }
    @if (photos.length > 0) {
      <div class="photo-gallery">
        @for (photo of photos; track $index) {
          <div class="photo-gallery__item">
            <img [src]="photo.url" [alt]="'Photo ' + ($index + 1)" />
            <button
              mat-icon-button
              type="button"
              class="photo-gallery__remove"
              (click)="removePhoto($index)"
            >
              <mat-icon>close</mat-icon>
            </button>
          </div>
        }
      </div>
    }
  </div>
</div>
