<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
    <app-dynamic-form [campos]="data.campos" [form]="form" />
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()">Cancelar</button>
    <button mat-flat-button [disabled]="form.invalid" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
