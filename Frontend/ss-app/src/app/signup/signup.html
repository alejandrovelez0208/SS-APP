<div class="signup-page">
    <div class="bg"></div>

    <div class="logo">
        <img src="/logo.png" alt="SweetScort">
        <span class="logo-text">WEETSCORT</span>
    </div>


    <div class="profile-type-container">
        <h1>Profile type</h1>

        <div class="options">
            <mat-card class="profile-card" [class.type-escort]="true" [class.selected]="selectedType === 'escort'"
                (click)="selectType('escort')">
                <div class="card-content">
                    <h2>Escort</h2>
                </div>
            </mat-card>

            <mat-card class="profile-card" [class.type-member]="true" [class.selected]="selectedType === 'member'"
                (click)="selectType('member')">
                <div class="card-content">
                    <h2>Member</h2>
                </div>
            </mat-card>
        </div>
    </div>
</div>
